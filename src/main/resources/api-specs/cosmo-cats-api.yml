openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  version: 1.0.0
  description: API для продажу космічних товарів
paths:
  /api/products:
    get:
      summary: Отримати список продуктів (з пагінацією)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paged envelope з продуктами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponse'
    post:
      summary: Створити новий продукт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Продукт створено
        '400':
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/products/{id}:
    get:
      summary: Отримати продукт за ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Знайдений продукт
    put:
      summary: Оновити продукт
    delete:
      summary: Видалити продукт

components:
  schemas:
    ProductCreateRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: "Galaxy Milk"
        price:
          type: number
          format: double
          example: 42.50
    PagedProductResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    ProductResponse:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          example: "https://cosmo-cats.market/errors/validation"
        title:
          type: string
          example: "Validation failed"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'price' must be greater than 0."
        instance:
          type: string
          example: "/api/products"